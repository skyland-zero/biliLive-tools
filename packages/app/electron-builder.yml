appId: com.electron.biliLiveTools
productName: biliLive-tools
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

directories:
  buildResources: build
files:
  - "!**/.vscode/*"
  - "!src/*"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
  - "!{.env,.env.*,.npmrc,pnpm-lock.yaml}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
  # 原生模块里运行时用不到的部分，与 packages/CLI/scripts/copy_module.js 的剪裁规则保持一致：
  # better-sqlite3 的 sqlite3 合并源码 / C++ 源码、font-ls 的 MSVC 中间产物、
  # meyda 的浏览器入口、shazamio-core 的 wasm 浏览器版。
  - "!**/better-sqlite3/{deps,src}/**"
  - "!**/better-sqlite3/binding.gyp"
  - "!**/font-ls/{src,test,.github}/**"
  - "!**/font-ls/.node-version"
  - "!**/font-ls/build/{binding.sln,config.gypi}"
  - "!**/font-ls/build/*.vcxproj*"
  - "!**/font-ls/build/Release/obj/**"
  - "!**/font-ls/build/Release/*.{pdb,iobj,ipdb,lib,exp}"
  - "!**/meyda/{src,bin,dist/web,dist/esm}/**"
  - "!**/shazamio-core/web/**"
asarUnpack:
  - resources/**
win:
  executableName: biliLive-tools
  target:
    - target: nsis
      arch: x64
    - target: zip
      arch: x64

nsis:
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  deleteAppDataOnUninstall: true
  oneClick: false
  allowToChangeInstallationDirectory: true
portable:
  artifactName: ${productName}-${version}-${os}-${arch}-portable.${ext}

mac:
  identity: null
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
  target:
    - target: dmg
      arch: arm64
dmg:
  # artifactName: ${name}-${version}.${ext}
linux:
  target:
    # - AppImage
    # - snap
    # - target: snap
    #   arch: x64
    - target: deb
      arch: x64
    - target: zip
      arch: x64
  maintainer: renmu123
  category: Utility
appImage:
  # artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
electronLanguages:
  - zh-CN
  - en-US
